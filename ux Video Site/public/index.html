<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; font-family: sans-serif; overflow: hidden;
        }
        #login-screen {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            width: 100%; height: 100%; color: #fff;
        }
        input, button { padding: 12px 20px; font-size: 16px; margin: 8px; border: none; border-radius: 4px; }
        input { width: 200px; }
        button { background: #333; color: #fff; cursor: pointer; }
        button:hover { background: #555; }
        #my-video { display: none; width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <!-- ログイン画面 -->
    <div id="login-screen">
        <input type="password" id="pass-input" placeholder="パスワードを入力">
        <button onclick="verifyPassword()">再生</button>
    </div>

    <!-- 動画要素（最初は非表示） -->
    <video id="my-video" controls controlsList="nodownload"></video>

    <script>
        async function verifyPassword() {
            const password = document.getElementById("pass-input").value;
            if (!password) return alert("パスワードを入力してください");

            const video = document.getElementById("my-video");
            const loginScreen = document.getElementById("login-screen");

            // FunctionsのAPI（/api/video）に対してパスワードを送信して動画を取得
            // ※「secret.mp4」を固定で読み出すようにします
            const videoUrl = `/api/video?password=${encodeURIComponent(password)}&name=secret.mp4`;
            
            // あらかじめ要素のソースにセット
            video.src = videoUrl;

            // 動画の読み込みと再生を試みる
            try {
                await video.play();
                
                // 再生が成功したら画面を切り替えてフルスクリーンにする
                loginScreen.style.display = "none";
                video.style.display = "block";

                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen(); // Safari用
                }
            } catch (error) {
                // パスワードが違う場合やエラーの時は再生に失敗する
                alert("パスワードが違います、または動画を再生できません。");
                video.src = "";
            }
        }
    </script>
</body>
</html>
