<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Video Gateway</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f11;
            color: #e4e4e7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #18181b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 720px;
            width: 90%;
            text-align: center;
            border: 1px solid #27272a;
        }
        h2 {
            margin-top: 0;
            color: #ffffff;
            font-weight: 600;
        }
        .input-group {
            margin: 1.5rem 0;
        }
        input[type="password"] {
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            background: #0f0f11;
            color: #ffffff;
            width: 240px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            border-color: #3b82f6;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            margin-left: 8px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #mediaWrapper {
            display: none;
            margin-top: 1.5rem;
            position: relative;
            padding-bottom: 56.25%; /* 16:9 の画面比率を維持 */
            height: 0;
            overflow: hidden;
            border-radius: 6px;
            border: 1px solid #27272a;
            background: #000;
        }
        #mediaWrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .error-text {
            color: #ef4444;
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <div id="authBlock">
        <h2>パスワード入力</h2>
        <p style="color: #a1a1aa; font-size: 14px;"></p>
        <div class="input-group">
            <input type="password" id="passKey" placeholder="Enter key...">
            <button onclick="verifyKey()">Unlock</button>
        </div>
        <div id="errLog" class="error-text"></div>
    </div>

    <div id="mediaWrapper">
        <iframe src="https://google.com" allow="autoplay"></iframe>
    </div>
</div>

<script>
    function verifyKey() {
        const input = document.getElementById("passKey").value;
        const errLog = document.getElementById("errLog");
        
        // パスワードを新しく指定された「1ichimilu4」に設定しました
        const secureToken = "1ichimilu4";

        if (input === secureToken) {
            document.getElementById("authBlock").style.display = "none";
            document.getElementById("mediaWrapper").style.display = "block";
        } else {
            errLog.textContent = "Invalid passcode. Access denied.";
            document.getElementById("passKey").value = "";
        }
    }

    document.getElementById("passKey").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            verifyKey();
        }
    });
</script>

</body>
</html>
