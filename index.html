<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Video Gateway</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f11;
            color: #e4e4e7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: #18181b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 480px;
            width: 90%;
            text-align: center;
            border: 1px solid #27272a;
            z-index: 10;
        }
        h2 {
            margin-top: 0;
            color: #ffffff;
            font-weight: 600;
        }
        .input-group {
            margin: 1.5rem 0;
        }
        input[type="password"] {
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            background: #0f0f11;
            color: #ffffff;
            width: 200px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            border-color: #3b82f6;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            margin-left: 8px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .error-text {
            color: #ef4444;
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
        }

        /* フルスクリーンプレイヤー用のCSS（Googleドライブのiframeは削除しました） */
        #mediaWrapper {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 999;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

<div class="card" id="authBlock">
    <h2>パスワード入力</h2>
    <div class="input-group">
        <input type="password" id="passKey" placeholder="Enter key...">
        <button onclick="verifyKey()">Unlock</button>
    </div>
    <div id="errLog" class="error-text"></div>
</div>

<div id="mediaWrapper">
    <!-- 同じフォルダにある video.mp4 を直接再生します -->
<video id="targetVideo" controls playsinline preload="auto">
    <!-- 下の「あなたのGitHubユーザー名」と「リポジトリ名」を実際の文字に書き換えてください -->
    <source src="https://github.io" type="video/mp4">
    Your browser does not support the video tag.
</video>

</div>

<script>
    function verifyKey() {
        const input = document.getElementById("passKey").value;
        const errLog = document.getElementById("errLog");
        
        // パスワード：1ichimilu4
        const secureToken = "1ichimilu4";

        if (input === secureToken) {
            document.getElementById("authBlock").style.display = "none";
            const wrapper = document.getElementById("mediaWrapper");
            const player = document.getElementById("targetVideo");
            
            wrapper.style.display = "block";
            
            // 強制フルスクリーン化
            if (wrapper.requestFullscreen) {
                wrapper.requestFullscreen();
            } else if (wrapper.webkitRequestFullscreen) {
                wrapper.webkitRequestFullscreen();
            }

            // 再生開始
            player.play().catch(err => {
                console.log("Autoplay blocked. User action required.");
            });
            
        } else {
            errLog.textContent = "Invalid passcode. Access denied.";
            document.getElementById("passKey").value = "";
        }
    }

    document.getElementById("passKey").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            verifyKey();
        }
    });
</script>

</body>
</html>
